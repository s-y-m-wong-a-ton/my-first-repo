# .vale.ini - Vale configuration
# Minimum alert level (suggestion, warning, error)
MinAlertLevel = suggestion
# Styles to load (we'll use Microsoft and write-good)
StylesPath = styles
# Vocabulary (custom words that are allowed)
Vocab = Base
# Apply to these file types
[*.md]
# Activate these style packages
BasedOnStyles = Vale, Microsoft, write-good

# Disable overly strict rules
write-good.E-Prime = NO        # Stop flagging "is/are"
write-good.TooWordy = NO       # Too aggressive
Microsoft.We = NO              # "We" is fine in docs
