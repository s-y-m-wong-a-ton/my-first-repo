name: Vale Linting

# When should this run?
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# What should it do?
jobs:
  vale:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get your code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Install Vale
      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          tar -xzf vale_3.13.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/
      
      # Step 3: Download your style rules
      - name: Download style packages
        run: |
          mkdir -p styles
          git clone --depth 1 https://github.com/errata-ai/Microsoft styles/Microsoft
          git clone --depth 1 https://github.com/errata-ai/write-good styles/write-good
      
      # Step 4: Run Vale on all markdown files
      - name: Run Vale
        run: vale --output=line . || true