name: Vale Linting

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  vale:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          tar -xzf vale_3.13.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/

      - name: Download and Clean Styles
        run: |
          mkdir -p docs/styles
          git clone --depth 1 https://github.com/errata-ai/Microsoft docs/styles/Microsoft
          git clone --depth 1 https://github.com/errata-ai/write-good docs/styles/write-good
          
          # 1. Remove the hidden .github folders
          find docs/styles -name ".github" -type d -exec rm -rf {} +

          # 2. Remove ANY .yml or .yaml files that are NOT in a 'rules' folder
          # This kills the coverage files and config files causing the E201 error
          find docs/styles -type f \( -name "*.yml" -o -name "*.yaml" \) ! -path "*/rules/*" -delete

          # 3. Specifically kill the file mentioned in your error just to be safe
          rm -rf docs/styles/Microsoft/coverage

      - name: Run Vale
        run: |
          # Move into the docs folder so Vale finds the .vale.ini
          cd docs
          # Run Vale on all markdown files in this directory
          vale --output=line . > ../vale-report.txt 2>&1 || true
          cd ..
          cat vale-report.txt

      - name: Upload Vale Report
        uses: actions/upload-artifact@v4
        with:
          name: vale-report
          path: vale-report.txt