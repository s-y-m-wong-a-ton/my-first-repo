name: Vale Linting

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  vale:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          tar -xzf vale_3.13.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/

      - name: Download and Clean Styles
        run: |
          mkdir -p docs/styles
          git clone --depth 1 https://github.com/errata-ai/Microsoft docs/styles/Microsoft
          git clone --depth 1 https://github.com/errata-ai/write-good docs/styles/write-good
          
          # Kill the YAML files that trigger the GitHub E201 error
          find docs/styles -type f \( -name "*.yml" -o -name "*.yaml" \) ! -path "*/rules/*" -delete
          find docs/styles -name ".github" -type d -exec rm -rf {} +

      - name: Run Vale
        run: |
          cd docs
          # We explicitly target ONLY .md files in the current directory.
          # This prevents Vale from descending into the 'styles' folder.
          vale --output=line *.md > ../vale-report.txt 2>&1 || true
          cd ..
          cat vale-report.txt

      - name: Upload Vale Report
        uses: actions/upload-artifact@v4
        with:
          name: vale-report
          path: vale-report.txt