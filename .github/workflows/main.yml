name: Vale Linting

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'  # Only run when docs folder changes
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:  # Manual trigger

jobs:
  vale:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get your code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Install Vale
      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          tar -xzf vale_3.13.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/
      
      # Step 3: Download style packages into docs/styles
      - name: Download style packages
        run: |
          mkdir -p docs/styles
          git clone --depth 1 https://github.com/errata-ai/Microsoft docs/styles/Microsoft
          git clone --depth 1 https://github.com/errata-ai/write-good docs/styles/write-good
      
      # Step 4: Run Vale on docs folder
      - name: Run Vale on docs folder
        run: |
          cd docs
          vale --output=line . > ../vale-report.txt || true
          cd ..          
          cat vale-report.txt
          echo "📊 Vale Report Generated"

      # Step 5: Upload report as artifact
      - name: Upload Vale Report
        uses: actions/upload-artifact@v4
        with:
          name: vale-report
          path: vale-report.txt