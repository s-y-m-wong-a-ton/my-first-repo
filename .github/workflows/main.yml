name: Vale Linting

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  vale:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          tar -xzf vale_3.13.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/

      - name: Download and Clean Styles
        run: |
          mkdir -p docs/styles
          cd docs/styles
          
          # Download Microsoft Style (Production Release)
          curl -L https://github.com/errata-ai/Microsoft/releases/latest/download/Microsoft.zip -o Microsoft.zip
          unzip Microsoft.zip && rm Microsoft.zip
          
          # Download write-good Style (Production Release)
          curl -L https://github.com/errata-ai/write-good/releases/latest/download/write-good.zip -o write-good.zip
          unzip write-good.zip && rm write-good.zip
          
          # Verify structure (This will show up in your logs)
          echo "Current directory: $(pwd)"
          ls -F

      - name: Run Vale
        run: |
          cd docs
          # Direct file targeting to avoid linting the 'styles' folder
          vale --output=line *.md > ../vale-report.txt 2>&1 || true
          cd ..
          cat vale-report.txt

      - name: Upload Vale Report
        uses: actions/upload-artifact@v4
        with:
          name: vale-report
          path: vale-report.txt