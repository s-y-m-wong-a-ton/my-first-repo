name: Vale Linting

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  vale:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Run Vale using the official Action
      - name: Vale Linting
        uses: errata-ai/vale-action@v2
        with:
          # This handles the download and installation of styles automatically
          styles: |
            https://github.com/errata-ai/Microsoft/releases/latest/download/Microsoft.zip
            https://github.com/errata-ai/write-good/releases/latest/download/write-good.zip
          
          # Point to your docs folder
          files: docs/
          
          # This will post the results directly into the PR/Action summary
          fail_on_error: false 

      # Step 3: Optional - Create a custom text report like your previous script
      # Note: The action already creates a nice UI summary, but this keeps your artifact
      - name: Generate Manual Report
        run: |
          echo "Vale Linting Report" > vale-report.txt
          echo "===================" >> vale-report.txt
          echo "Date: $(date)" >> vale-report.txt
          # We run the local vale binary (installed by the action) to generate the file
          ./bin/vale --output=line docs/*.md >> vale-report.txt 2>&1 || true

      - name: Upload Vale Report
        uses: actions/upload-artifact@v4
        with:
          name: vale-report
          path: vale-report.txt